[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps = 
	pololu/VL6180X@^1.4.0
	janelia-arduino/Vector@^1.4.0
	https://github.com/vkumpan/SSD1306
	rfetick/MPU6050_light@^1.1.0
